name: CI Android Mobile

on:
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/cliente-mobile/**'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/cliente-mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x apps/cliente-mobile/gradlew || true
        
      - name: Build with Gradle
        working-directory: apps/cliente-mobile
        run: ./gradlew assembleDebug
